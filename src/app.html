<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#004fbb" />

		<!-- Preload das duas TIM Sans (35 KB cada).
		     Sem isto o navegador só descobre a fonte DEPOIS de parsear o CSS inline,
		     e ela chegava por volta de 1,5s numa conexão 4G moderada — logo depois
		     do primeiro paint, o que produzia o reflow de texto que dominava o CLS
		     (0,221 na home, 0,199 nos artigos, contra o limite de 0,1).
		     `crossorigin` é obrigatório mesmo em fonte de mesma origem: sem ele o
		     preload e o download do @font-face viram duas requisições distintas e
		     o preload não serve para nada. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/wp-content/uploads/2025/10/c875cb65af48db4e990ed39d981b9ef1.woff2"
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			crossorigin
			href="%sveltekit.assets%/wp-content/uploads/2025/10/57b88f8a459956fcac90a4e1a8e0f97b.woff2"
		/>

		<!-- Verificação do Google Search Console — mesma tag do site WordPress
		     anterior (snippet 2670). Mantê-la preserva a propriedade já verificada. -->
		<meta name="google-site-verification" content="3PZLGrA470_oq1V9tNyjRtmPWBhlPacImk6vsutSIVI" />

		<!-- GA4 condicionado ao consentimento (LGPD): nada de cookie de análise antes
		     do aceite no banner (CookieConsent.svelte). `carregarAnalytics` é chamada
		     aqui (visitante que já aceitou) ou pelo banner, no clique de aceitar.

		     G-N8PJH573Q8 segue DESATIVADA: essa Google Tag carrega junto a
		     UA-250391626-1 (Universal Analytics, morto desde jul/2023) — ~123 KB de
		     script inútil. Corrigido o GTM no painel do Google, descomente a linha
		     marcada abaixo. -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			window.gtag = gtag;
			window.carregarAnalytics = function () {
				if (window.__analyticsCarregado) return;
				window.__analyticsCarregado = true;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KT584R0KVS';
				document.head.appendChild(s);
				gtag('js', new Date());
				// gtag('config', 'G-N8PJH573Q8'); — reative quando o GTM for corrigido.
				gtag('config', 'G-KT584R0KVS');
			};
			if (localStorage.getItem('consentimento-cookies') === 'aceito') {
				window.carregarAnalytics();
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
